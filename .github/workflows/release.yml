name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package (e.g. v0.1.5)'
        required: false
        default: 'v0.1.5'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, Package & Publish Release
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formatting, types, build & tests
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Package CLI tarball & VS Code VSIX
        run: |
          pnpm package:extension
          cd packages/cli && npm pack

      - name: Create GitHub Release with artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              packages/vscode-extension/*.vsix \
              packages/cli/*.tgz \
              --clobber
          else
            gh release create "$TAG" \
              packages/vscode-extension/*.vsix \
              packages/cli/*.tgz \
              --title "ParaSpace $TAG" \
              --generate-notes
          fi

      - name: Publish @para-space-dev/cli to npm
        if: env.NPM_TOKEN != ''
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@para-space-dev/cli@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "@para-space-dev/cli@$PKG_VERSION is already published to npm. Skipping."
          else
            npm publish --provenance --access public
          fi

      - name: Publish extension to VS Code Marketplace (OIDC Trusted Publishing)
        working-directory: packages/vscode-extension
        run: npx @vscode/vsce publish --packagePath *.vsix --oidc --skip-duplicate

      - name: Publish extension to Open VSX Registry
        if: env.OVSX_PAT != ''
        working-directory: packages/vscode-extension
        run: npx ovsx publish *.vsix -p "$OVSX_PAT"
